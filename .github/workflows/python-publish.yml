# This workflow will upload a Python Package using Twine when a PR is merged.
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip install --upgrade -r requirements_test.txt
          python -m pip install .
      - name: Run tests
        run: |
          python runtests.py
      - name: Create source distribution
        run: |
          python3 -m build
      - name: Check distribution metadata
        # Fail here rather than at the upload step. Keep this twine pin in
        # sync with the one shipped by the publish action below, so the
        # metadata is validated by the same version that will upload it.
        run: |
          pip install --upgrade twine==7.0.0
          twine check --strict dist/*
      - name: Publish package
        # v1.14.2, which ships twine 7.0.0. Keep this recent: the previous
        # pin shipped twine 5.x, which cannot read the Metadata-Version 2.4
        # that current setuptools emits and rejects the dist claiming its
        # Name and Version are missing.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
